spring:
  application:
    name: blog
  datasource:
    url: jdbc:h2:file:./testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  threads:
    virtual:
      enabled: true

server:
  servlet:
    context-path: /api/v1
  tomcat:
    threads:
      max: 200


